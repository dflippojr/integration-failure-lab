name: ci
# engine, java and playwright run in parallel; gate is the one check a ruleset requires.
# Run the same steps locally with npm run ci:local.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      # ESLint recommended rules over the hand-written JS (eslint.config.js).
      - run: npm run lint
      # npm test with coverage floors (see test:coverage in package.json): lines 97, branches 92.
      # Measured 2026-10-16: 99.21 / 96.24 here on Node 22, 98.23 / 93.75 locally on Node 24, which counts
      # branches differently. Floors sit 1 point below the lower, rounded down, so npm run ci:local passes
      # on both. Floors only ever go up.
      - run: npm run test:coverage
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # verify also runs the JaCoCo line-coverage floor in java/pom.xml.
      - run: ./mvnw -B verify
  playwright:
    # This repository is public: execute only on GitHub-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui -- --workers=1
      - name: Stop disposable instance (also after failures)
        if: always()
        run: npm run ui:stop
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  gate:
    # Always reports, so a failed, cancelled or skipped job above turns gate red instead of leaving it pending.
    needs: [engine, java, playwright]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
  publish:
    # Rolling lab-bundle pre-release: dist/ and its build.json stamp from each main commit that passes gate.
    # personal-website re-vendors from it, and scripts/site-freshness.mjs reports a copy that falls behind main.
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Publishes queue rather than cancel, so the newest passing commit always publishes last.
    concurrency:
      group: lab-bundle
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: lab-bundle
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Require a clean build of this commit
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
          jq -e --arg sha "$GITHUB_SHA" '.gitCommit == $sha and .builtFrom == "integration-failure-lab"' dist/build.json
      - name: Skip when the release already holds a newer main commit
        id: order
        run: |
          current=$(gh release download "$TAG" -p build.json -O - 2>/dev/null | jq -r '.gitCommit // empty' || true)
          if [ -n "$current" ] && [ "$current" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$current"; then
            echo "The $TAG release holds $current, which is newer than $GITHUB_SHA; not publishing."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the lab-bundle pre-release
        if: steps.order.outputs.skip != 'true'
        run: |
          (cd dist && zip -X -q -r ../lab-bundle.zip .)
          notes="dist/ built from ${GITHUB_SHA} (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}). Replaced on every main commit that passes gate; build.json names the commit."
          # Move the tag to this commit so the release points at what it contains.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --notes "$notes"
            gh release upload "$TAG" lab-bundle.zip dist/build.json --clobber
          else
            gh release create "$TAG" lab-bundle.zip dist/build.json --prerelease --target "$GITHUB_SHA" \
              --title "Lab bundle (rolling, from main)" --notes "$notes"
          fi
          echo "Published ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
