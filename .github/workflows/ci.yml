name: ci
# engine, java, differential, playwright and gate-guard run in parallel; gate is the one check a ruleset requires.
# Run the same steps locally with npm run ci:local.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      # ESLint recommended rules over the hand-written JS (eslint.config.js).
      - run: npm run lint
      # npm test with coverage floors (see test:coverage in package.json): lines 97, branches 92.
      # Measured 2026-10-16: 99.21 / 96.24 here on Node 22, 98.23 / 93.75 locally on Node 24, which counts
      # branches differently. Floors sit 1 point below the lower, rounded down, so npm run ci:local passes
      # on both. Floors only ever go up.
      - run: npm run test:coverage
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # verify also runs the JaCoCo line-coverage floor in java/pom.xml.
      - run: ./mvnw -B verify
  # Every Free-form combination through the browser engine and the Java runner over real HTTP;
  # any outcome they disagree on that test/differential/known.json does not explain fails the job.
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B package -DskipTests
        working-directory: java
      - run: npm run differential
  playwright:
    # This repository is public: execute only on GitHub-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui -- --workers=1
      - name: Stop disposable instance (also after failures)
        if: always()
        run: npm run ui:stop
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  # The shared gate guard (dflippojr/.github), pinned by full SHA: fails a pull
  # request that deletes tests, adds #[ignore], adds retries, or edits
  # workflows or coverage config, unless the owner applied gate-change-approved.
  # guard-ref names the same SHA, so the script that judges the pull request is
  # the one that was reviewed. It checks pull requests only (a push prints a
  # notice). Labels are read when the job runs: after the owner applies one,
  # re-run this job.
  # This job is an early signal inside gate, not the judge: it runs from the
  # pull request's head, so a pull request can replace it, and it accepts a
  # label applied before the newest push. The trusted copy is
  # gate-guard-target.yml, which runs from main and posts the gate-guard check
  # the ruleset requires.
  gate-guard:
    # gate-guard.yml requests these three; a called workflow can't hold more than its caller.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: dflippojr/.github/.github/workflows/gate-guard.yml@e2c7fae8508be0359f3abaf136caade46ee7479c
    with:
      guard-ref: e2c7fae8508be0359f3abaf136caade46ee7479c
      require-owner-label-actor: true
  gate:
    # Always reports, so a failed, cancelled or skipped job above turns gate red instead of leaving it pending.
    needs: [engine, java, differential, playwright, gate-guard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
