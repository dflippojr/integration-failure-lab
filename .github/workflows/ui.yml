name: UI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  playwright:
    # This repository is public: execute only on GitHub-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui -- --workers=1
      - name: Stop disposable instance (also after failures)
        if: always()
        run: npm run ui:stop
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
